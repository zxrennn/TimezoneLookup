<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Overlap — World time by country</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <script>
    /* Apply saved theme before first paint to avoid a flash. */
    try { var t = localStorage.getItem('overlap.theme'); if (t === 'light') document.documentElement.classList.remove('dark'); } catch (e) {}
  </script>
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script>tailwind.config = { darkMode: 'class' };</script>

    [hidden] { display: none !important; }

    html.dark { color-scheme: dark; }
    body, header, input, ul, li, button { transition: background-color .2s ease, border-color .2s ease, color .2s ease; }

</head>

<div class="flex items-center gap-1">

    </section>
  </main>

  <script>
  (() => {
    'use strict';

    /* IANA zone ids per ISO country code (from the tz database's zone.tab).
       Identifiers only — all times and offsets are computed live via Intl. */
    const ZONES = {"AD":["Europe/Andorra"],"AE":["Asia/Dubai"],"AF":["Asia/Kabul"],"AG":["America/Antigua"],"AI":["America/Anguilla"],"AL":["Europe/Tirane"],"AM":["Asia/Yerevan"],"AO":["Africa/Luanda"],"AQ":["Antarctica/McMurdo","Antarctica/Casey","Antarctica/Davis","Antarctica/DumontDUrville","Antarctica/Mawson","Antarctica/Palmer","Antarctica/Rothera","Antarctica/Syowa","Antarctica/Troll","Antarctica/Vostok"],"AR":["America/Argentina/Buenos_Aires","America/Argentina/Cordoba","America/Argentina/Salta","America/Argentina/Jujuy","America/Argentina/Tucuman","America/Argentina/Catamarca","America/Argentina/La_Rioja","America/Argentina/San_Juan","America/Argentina/Mendoza","America/Argentina/San_Luis","America/Argentina/Rio_Gallegos","America/Argentina/Ushuaia"],"AS":["Pacific/Pago_Pago"],"AT":["Europe/Vienna"],"AU":["Australia/Lord_Howe","Antarctica/Macquarie","Australia/Hobart","Australia/Melbourne","Australia/Sydney","Australia/Broken_Hill","Australia/Brisbane","Australia/Lindeman","Australia/Adelaide","Australia/Darwin","Australia/Perth","Australia/Eucla"],"AW":["America/Aruba"],"AX":["Europe/Mariehamn"],"AZ":["Asia/Baku"],"BA":["Europe/Sarajevo"],"BB":["America/Barbados"],"BD":["Asia/Dhaka"],"BE":["Europe/Brussels"],"BF":["Africa/Ouagadougou"],"BG":["Europe/Sofia"],"BH":["Asia/Bahrain"],"BI":["Africa/Bujumbura"],"BJ":["Africa/Porto-Novo"],"BL":["America/St_Barthelemy"],"BM":["Atlantic/Bermuda"],"BN":["Asia/Brunei"],"BO":["America/La_Paz"],"BQ":["America/Kralendijk"],"BR":["America/Noronha","America/Belem","America/Fortaleza","America/Recife","America/Araguaina","America/Maceio","America/Bahia","America/Sao_Paulo","America/Campo_Grande","America/Cuiaba","America/Santarem","America/Porto_Velho","America/Boa_Vista","America/Manaus","America/Eirunepe","America/Rio_Branco"],"BS":["America/Nassau"],"BT":["Asia/Thimphu"],"BW":["Africa/Gaborone"],"BY":["Europe/Minsk"],"BZ":["America/Belize"],"CA":["America/St_Johns","America/Halifax","America/Glace_Bay","America/Moncton","America/Goose_Bay","America/Blanc-Sablon","America/Toronto","America/Iqaluit","America/Atikokan","America/Winnipeg","America/Resolute","America/Rankin_Inlet","America/Regina","America/Swift_Current","America/Edmonton","America/Cambridge_Bay","America/Inuvik","America/Vancouver","America/Creston","America/Dawson_Creek","America/Fort_Nelson","America/Whitehorse","America/Dawson"],"CC":["Indian/Cocos"],"CD":["Africa/Kinshasa","Africa/Lubumbashi"],"CF":["Africa/Bangui"],"CG":["Africa/Brazzaville"],"CH":["Europe/Zurich"],"CI":["Africa/Abidjan"],"CK":["Pacific/Rarotonga"],"CL":["America/Santiago","America/Coyhaique","America/Punta_Arenas","Pacific/Easter"],"CM":["Africa/Douala"],"CN":["Asia/Shanghai","Asia/Urumqi"],"CO":["America/Bogota"],"CR":["America/Costa_Rica"],"CU":["America/Havana"],"CV":["Atlantic/Cape_Verde"],"CW":["America/Curacao"],"CX":["Indian/Christmas"],"CY":["Asia/Nicosia","Asia/Famagusta"],"CZ":["Europe/Prague"],"DE":["Europe/Berlin","Europe/Busingen"],"DJ":["Africa/Djibouti"],"DK":["Europe/Copenhagen"],"DM":["America/Dominica"],"DO":["America/Santo_Domingo"],"DZ":["Africa/Algiers"],"EC":["America/Guayaquil","Pacific/Galapagos"],"EE":["Europe/Tallinn"],"EG":["Africa/Cairo"],"EH":["Africa/El_Aaiun"],"ER":["Africa/Asmara"],"ES":["Europe/Madrid","Africa/Ceuta","Atlantic/Canary"],"ET":["Africa/Addis_Ababa"],"FI":["Europe/Helsinki"],"FJ":["Pacific/Fiji"],"FK":["Atlantic/Stanley"],"FM":["Pacific/Chuuk","Pacific/Pohnpei","Pacific/Kosrae"],"FO":["Atlantic/Faroe"],"FR":["Europe/Paris"],"GA":["Africa/Libreville"],"GB":["Europe/London"],"GD":["America/Grenada"],"GE":["Asia/Tbilisi"],"GF":["America/Cayenne"],"GG":["Europe/Guernsey"],"GH":["Africa/Accra"],"GI":["Europe/Gibraltar"],"GL":["America/Nuuk","America/Danmarkshavn","America/Scoresbysund","America/Thule"],"GM":["Africa/Banjul"],"GN":["Africa/Conakry"],"GP":["America/Guadeloupe"],"GQ":["Africa/Malabo"],"GR":["Europe/Athens"],"GS":["Atlantic/South_Georgia"],"GT":["America/Guatemala"],"GU":["Pacific/Guam"],"GW":["Africa/Bissau"],"GY":["America/Guyana"],"HK":["Asia/Hong_Kong"],"HN":["America/Tegucigalpa"],"HR":["Europe/Zagreb"],"HT":["America/Port-au-Prince"],"HU":["Europe/Budapest"],"ID":["Asia/Jakarta","Asia/Pontianak","Asia/Makassar","Asia/Jayapura"],"IE":["Europe/Dublin"],"IL":["Asia/Jerusalem"],"IM":["Europe/Isle_of_Man"],"IN":["Asia/Kolkata"],"IO":["Indian/Chagos"],"IQ":["Asia/Baghdad"],"IR":["Asia/Tehran"],"IS":["Atlantic/Reykjavik"],"IT":["Europe/Rome"],"JE":["Europe/Jersey"],"JM":["America/Jamaica"],"JO":["Asia/Amman"],"JP":["Asia/Tokyo"],"KE":["Africa/Nairobi"],"KG":["Asia/Bishkek"],"KH":["Asia/Phnom_Penh"],"KI":["Pacific/Tarawa","Pacific/Kanton","Pacific/Kiritimati"],"KM":["Indian/Comoro"],"KN":["America/St_Kitts"],"KP":["Asia/Pyongyang"],"KR":["Asia/Seoul"],"KW":["Asia/Kuwait"],"KY":["America/Cayman"],"KZ":["Asia/Almaty","Asia/Qyzylorda","Asia/Qostanay","Asia/Aqtobe","Asia/Aqtau","Asia/Atyrau","Asia/Oral"],"LA":["Asia/Vientiane"],"LB":["Asia/Beirut"],"LC":["America/St_Lucia"],"LI":["Europe/Vaduz"],"LK":["Asia/Colombo"],"LR":["Africa/Monrovia"],"LS":["Africa/Maseru"],"LT":["Europe/Vilnius"],"LU":["Europe/Luxembourg"],"LV":["Europe/Riga"],"LY":["Africa/Tripoli"],"MA":["Africa/Casablanca"],"MC":["Europe/Monaco"],"MD":["Europe/Chisinau"],"ME":["Europe/Podgorica"],"MF":["America/Marigot"],"MG":["Indian/Antananarivo"],"MH":["Pacific/Majuro","Pacific/Kwajalein"],"MK":["Europe/Skopje"],"ML":["Africa/Bamako"],"MM":["Asia/Yangon"],"MN":["Asia/Ulaanbaatar","Asia/Hovd"],"MO":["Asia/Macau"],"MP":["Pacific/Saipan"],"MQ":["America/Martinique"],"MR":["Africa/Nouakchott"],"MS":["America/Montserrat"],"MT":["Europe/Malta"],"MU":["Indian/Mauritius"],"MV":["Indian/Maldives"],"MW":["Africa/Blantyre"],"MX":["America/Mexico_City","America/Cancun","America/Merida","America/Monterrey","America/Matamoros","America/Chihuahua","America/Ciudad_Juarez","America/Ojinaga","America/Mazatlan","America/Bahia_Banderas","America/Hermosillo","America/Tijuana"],"MY":["Asia/Kuala_Lumpur","Asia/Kuching"],"MZ":["Africa/Maputo"],"NA":["Africa/Windhoek"],"NC":["Pacific/Noumea"],"NE":["Africa/Niamey"],"NF":["Pacific/Norfolk"],"NG":["Africa/Lagos"],"NI":["America/Managua"],"NL":["Europe/Amsterdam"],"NO":["Europe/Oslo"],"NP":["Asia/Kathmandu"],"NR":["Pacific/Nauru"],"NU":["Pacific/Niue"],"NZ":["Pacific/Auckland","Pacific/Chatham"],"OM":["Asia/Muscat"],"PA":["America/Panama"],"PE":["America/Lima"],"PF":["Pacific/Tahiti","Pacific/Marquesas","Pacific/Gambier"],"PG":["Pacific/Port_Moresby","Pacific/Bougainville"],"PH":["Asia/Manila"],"PK":["Asia/Karachi"],"PL":["Europe/Warsaw"],"PM":["America/Miquelon"],"PN":["Pacific/Pitcairn"],"PR":["America/Puerto_Rico"],"PS":["Asia/Gaza","Asia/Hebron"],"PT":["Europe/Lisbon","Atlantic/Madeira","Atlantic/Azores"],"PW":["Pacific/Palau"],"PY":["America/Asuncion"],"QA":["Asia/Qatar"],"RE":["Indian/Reunion"],"RO":["Europe/Bucharest"],"RS":["Europe/Belgrade"],"RU":["Europe/Kaliningrad","Europe/Moscow","Europe/Kirov","Europe/Volgograd","Europe/Astrakhan","Europe/Saratov","Europe/Ulyanovsk","Europe/Samara","Asia/Yekaterinburg","Asia/Omsk","Asia/Novosibirsk","Asia/Barnaul","Asia/Tomsk","Asia/Novokuznetsk","Asia/Krasnoyarsk","Asia/Irkutsk","Asia/Chita","Asia/Yakutsk","Asia/Khandyga","Asia/Vladivostok","Asia/Ust-Nera","Asia/Magadan","Asia/Sakhalin","Asia/Srednekolymsk","Asia/Kamchatka","Asia/Anadyr"],"UA":["Europe/Simferopol","Europe/Kyiv"],"RW":["Africa/Kigali"],"SA":["Asia/Riyadh"],"SB":["Pacific/Guadalcanal"],"SC":["Indian/Mahe"],"SD":["Africa/Khartoum"],"SE":["Europe/Stockholm"],"SG":["Asia/Singapore"],"SH":["Atlantic/St_Helena"],"SI":["Europe/Ljubljana"],"SJ":["Arctic/Longyearbyen"],"SK":["Europe/Bratislava"],"SL":["Africa/Freetown"],"SM":["Europe/San_Marino"],"SN":["Africa/Dakar"],"SO":["Africa/Mogadishu"],"SR":["America/Paramaribo"],"SS":["Africa/Juba"],"ST":["Africa/Sao_Tome"],"SV":["America/El_Salvador"],"SX":["America/Lower_Princes"],"SY":["Asia/Damascus"],"SZ":["Africa/Mbabane"],"TC":["America/Grand_Turk"],"TD":["Africa/Ndjamena"],"TF":["Indian/Kerguelen"],"TG":["Africa/Lome"],"TH":["Asia/Bangkok"],"TJ":["Asia/Dushanbe"],"TK":["Pacific/Fakaofo"],"TL":["Asia/Dili"],"TM":["Asia/Ashgabat"],"TN":["Africa/Tunis"],"TO":["Pacific/Tongatapu"],"TR":["Europe/Istanbul"],"TT":["America/Port_of_Spain"],"TV":["Pacific/Funafuti"],"TW":["Asia/Taipei"],"TZ":["Africa/Dar_es_Salaam"],"UG":["Africa/Kampala"],"UM":["Pacific/Midway","Pacific/Wake"],"US":["America/New_York","America/Detroit","America/Kentucky/Louisville","America/Kentucky/Monticello","America/Indiana/Indianapolis","America/Indiana/Vincennes","America/Indiana/Winamac","America/Indiana/Marengo","America/Indiana/Petersburg","America/Indiana/Vevay","America/Chicago","America/Indiana/Tell_City","America/Indiana/Knox","America/Menominee","America/North_Dakota/Center","America/North_Dakota/New_Salem","America/North_Dakota/Beulah","America/Denver","America/Boise","America/Phoenix","America/Los_Angeles","America/Anchorage","America/Juneau","America/Sitka","America/Metlakatla","America/Yakutat","America/Nome","America/Adak","Pacific/Honolulu"],"UY":["America/Montevideo"],"UZ":["Asia/Samarkand","Asia/Tashkent"],"VA":["Europe/Vatican"],"VC":["America/St_Vincent"],"VE":["America/Caracas"],"VG":["America/Tortola"],"VI":["America/St_Thomas"],"VN":["Asia/Ho_Chi_Minh"],"VU":["Pacific/Efate"],"WF":["Pacific/Wallis"],"WS":["Pacific/Apia"],"YE":["Asia/Aden"],"YT":["Indian/Mayotte"],"ZA":["Africa/Johannesburg"],"ZM":["Africa/Lusaka"],"ZW":["Africa/Harare"]};

    const ALIASES = { USA: 'US', America: 'US', 'United States of America': 'US', UK: 'GB', Britain: 'GB', England: 'GB', Scotland: 'GB', Wales: 'GB',
      UAE: 'AE', Holland: 'NL', Burma: 'MM', Russia: 'RU', Korea: 'KR', 'South Korea': 'KR', 'North Korea': 'KP', Czechia: 'CZ', 'Ivory Coast': 'CI', Turkey: 'TR' };

    /* 12h (AM/PM) vs 24h. Defaults to the browser's own preference, then remembers the user's choice. */
    let use24 = (() => {
      try { const v = localStorage.getItem('overlap.clock'); if (v) return v === '24'; } catch {}
      try { return !new Intl.DateTimeFormat(undefined, { hour: 'numeric' }).resolvedOptions().hour12; } catch { return false; }
    })();

    const $ = s => document.querySelector(s);
    const q = $('#q'), list = $('#list'), main = $('#main'), result = $('#result');
    const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const norm = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9 ]+/g, ' ').replace(/\s+/g, ' ').trim();

    /* ---------- Timezone helpers (all native Intl) ---------- */
    const cache = new Map();
    const fmt = (key, locale, opts) => { let f = cache.get(key); if (!f) { f = new Intl.DateTimeFormat(locale, opts); cache.set(key, f); } return f; };
    const valid = id => { try { new Intl.DateTimeFormat('en-US', { timeZone: id }); return true; } catch { return false; } };

    function parts(tz, d) {
      const o = {};
      for (const p of fmt('p' + tz, 'en-US', { timeZone: tz, hourCycle: 'h23', year: 'numeric', month: 'numeric', day: 'numeric', hour: 'numeric', minute: 'numeric', second: 'numeric' }).formatToParts(d))
        if (p.type !== 'literal') o[p.type] = +p.value;
      o.hour %= 24; return o;
    }
    function offsetMin(tz, d) {
      const p = parts(tz, d);
      return Math.round((Date.UTC(p.year, p.month - 1, p.day, p.hour, p.minute, p.second) - (d.getTime() - d.getMilliseconds())) / 60000);
    }
    function offsetLabel(m) {
      if (!m) return 'UTC+0';
      const a = Math.abs(m), mm = a % 60;
      return 'UTC' + (m < 0 ? '−' : '+') + Math.floor(a / 60) + (mm ? ':' + String(mm).padStart(2, '0') : '');
    }
    const cityName = id => (id.split('/').pop() || id).replace(/_/g, ' ');

    /* ---------- Countries ---------- */
    const names = (() => { try { return new Intl.DisplayNames(['en'], { type: 'region' }); } catch { return null; } })();
    const COUNTRIES = Object.keys(ZONES)
      .map(code => ({ code, name: (names && names.of(code)) || code }))
      .filter(c => c.name !== c.code || !names)
      .sort((a, b) => a.name.localeCompare(b.name))
      .map(c => ({ ...c, key: norm(c.name) }));

    function search(text) {
      const n = norm(text);
      if (!n) return [];
      const alias = Object.keys(ALIASES).filter(a => norm(a) === n || norm(a).startsWith(n)).map(a => ALIASES[a]);
      const hits = COUNTRIES.map(c => {
        let r = -1;
        if (c.key === n || c.code.toLowerCase() === n || alias.includes(c.code)) r = 0;
        else if (c.key.startsWith(n)) r = 1;
        else if (c.key.split(' ').some(w => w.startsWith(n))) r = 2;
        else if (c.key.includes(n)) r = 3;
        return { c, r };
      }).filter(x => x.r >= 0);
      return hits.sort((a, b) => a.r - b.r || a.c.name.localeCompare(b.c.name)).slice(0, 8).map(x => x.c);
    }

    /* ---------- Combobox ---------- */
    let matches = [], active = -1;
    const openList = o => { list.hidden = !o; q.setAttribute('aria-expanded', o); if (!o) { active = -1; q.removeAttribute('aria-activedescendant'); } };

    function showSuggestions() {
      matches = search(q.value);
      if (!q.value.trim()) return openList(false);
      list.innerHTML = matches.length
        ? matches.map((c, i) => `<li role="option" id="o${i}" data-i="${i}" aria-selected="false" class="flex cursor-pointer items-center justify-between rounded-lg px-3 py-2.5 text-sm aria-selected:bg-indigo-500/10 hover:bg-zinc-100 dark:hover:bg-zinc-800"><span>${esc(c.name)}</span><span class="text-xs text-zinc-400">${ZONES[c.code].length} timezone${ZONES[c.code].length > 1 ? 's' : ''}</span></li>`).join('')
        : `<li role="presentation" class="px-3 py-3 text-sm text-zinc-500">No country found</li>`;
      active = -1; openList(true);
    }
    function setActive(i) {
      const items = list.querySelectorAll('[role=option]'); if (!items.length) return;
      active = (i + items.length) % items.length;
      items.forEach((n, k) => n.setAttribute('aria-selected', k === active));
      q.setAttribute('aria-activedescendant', items[active].id); items[active].scrollIntoView({ block: 'nearest' });
    }

    /* ---------- Result ---------- */
    let rows = [];
    function choose(c) {
      q.value = c.name; openList(false); q.blur();
      const ids = ZONES[c.code].filter(valid);
      const now = new Date();
      // Group by city, ordered west → east by current offset.
      const items = ids.map(id => ({ id, off: offsetMin(id, now) })).sort((a, b) => a.off - b.off || cityName(a.id).localeCompare(cityName(b.id)));
      const distinct = new Set(items.map(i => i.off)).size;

      $('#country').textContent = c.name;
      $('#sub').textContent = `${items.length} ${items.length === 1 ? 'city' : 'cities'} · ${distinct} ${distinct === 1 ? 'time' : 'different times'} right now`;
      $('#cities').innerHTML = items.map((it, i) => `
        <li class="city flex items-center justify-between gap-4 py-3.5" style="animation-delay:${Math.min(i, 12) * 20}ms" data-tz="${esc(it.id)}">
          <div class="min-w-0">
            <p class="truncate font-medium">${esc(cityName(it.id))}</p>
            <p class="truncate text-xs text-zinc-500 dark:text-zinc-400"><span data-date></span> · <span data-off></span></p>
          </div>
          <p data-time class="shrink-0 text-xl font-semibold tabular-nums"></p>
        </li>`).join('');
      rows = [...document.querySelectorAll('#cities li')].map(li => ({ tz: li.dataset.tz, time: li.querySelector('[data-time]'), date: li.querySelector('[data-date]'), off: li.querySelector('[data-off]') }));
      main.classList.replace('pt-[22vh]', 'pt-10');
      result.hidden = false;
      tick();
    }

    function tick() {
      const now = new Date();
      for (const r of rows) {
        r.time.textContent = (use24
          ? fmt('t24' + r.tz, undefined, { timeZone: r.tz, hourCycle: 'h23', hour: '2-digit', minute: '2-digit' })
          : fmt('t12' + r.tz, undefined, { timeZone: r.tz, hour12: true, hour: 'numeric', minute: '2-digit' })).format(now);
        r.date.textContent = fmt('d' + r.tz, undefined, { timeZone: r.tz, weekday: 'short', month: 'short', day: 'numeric' }).format(now);
        r.off.textContent = offsetLabel(offsetMin(r.tz, now));
      }
    }
    (function loop() { tick(); setTimeout(loop, 1000 - (Date.now() % 1000) + 5); })();

    /* ---------- Events ---------- */
    q.addEventListener('input', showSuggestions);
    q.addEventListener('focus', () => { if (q.value.trim() && q.value !== $('#country').textContent) showSuggestions(); else q.select(); });
    q.addEventListener('keydown', e => {
      if (e.key === 'ArrowDown') { e.preventDefault(); if (list.hidden) showSuggestions(); setActive(active + 1); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); setActive(active - 1); }
      else if (e.key === 'Enter') { const c = matches[active >= 0 ? active : 0]; if (c && !list.hidden) { e.preventDefault(); choose(c); } }
      else if (e.key === 'Escape') openList(false);
    });
    list.addEventListener('mousedown', e => { const li = e.target.closest('[role=option]'); if (li) { e.preventDefault(); choose(matches[+li.dataset.i]); } });
    document.addEventListener('click', e => { if (!e.target.closest('#q, #list')) openList(false); });

    /* ---------- Review link ---------- */
    // Put the page you want people to land on here (a Google Form, your repo, etc.), e.g. 'https://forms.gle/abc123'.
    // If left empty on GitHub Pages, it falls back to your repo's "new issue" page.
    const REVIEW_URL = 'https://forms.gle/9TfWK3XwQeKPWttg7';

    function reviewHref() {
      if (REVIEW_URL) return REVIEW_URL;
      const m = location.hostname.match(/^([^.]+)\.github\.io$/i);
      if (!m) return '';
      const first = location.pathname.split('/').filter(Boolean)[0];
      return `https://github.com/${m[1]}/${first && !/\.html?$/i.test(first) ? first : m[1] + '.github.io'}/issues/new`;
    }
    const reviewLink = $('#review-link'), href = reviewHref();
    if (href) reviewLink.href = href; else reviewLink.hidden = true; // no destination known → don't show a dead link

    $('#theme').addEventListener('click', () => {
      const root = document.documentElement;
      const dark = root.classList.toggle('dark');
      $('#theme').setAttribute('aria-label', dark ? 'Switch to light mode' : 'Switch to dark mode');
      try { localStorage.setItem('overlap.theme', dark ? 'dark' : 'light'); } catch {}
    });
    const clockBtn = $('#clock');
    function syncClockBtn() {
      clockBtn.textContent = use24 ? '24h' : 'AM/PM';
      clockBtn.setAttribute('aria-label', use24 ? 'Switch to 12-hour time (AM/PM)' : 'Switch to 24-hour time');
    }
    clockBtn.addEventListener('click', () => {
      use24 = !use24; syncClockBtn(); tick();
      try { localStorage.setItem('overlap.clock', use24 ? '24' : '12'); } catch {}
    });
    syncClockBtn();

    if (!document.documentElement.classList.contains('dark')) $('#theme').setAttribute('aria-label', 'Switch to dark mode');
  })();
  </script>
</body>
